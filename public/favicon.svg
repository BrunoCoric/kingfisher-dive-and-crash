<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Kingfisher">
  <defs>
    <radialGradient id="wash" cx="38%" cy="36%" r="62%">
      <stop offset="0%" stop-color="#f2f8fa"/>
      <stop offset="45%" stop-color="#a8cfdc"/>
      <stop offset="100%" stop-color="#7eb8cc"/>
    </radialGradient>
    <radialGradient id="head" cx="42%" cy="38%" r="58%">
      <stop offset="0%" stop-color="#4a7fd4"/>
      <stop offset="55%" stop-color="#2b5fbf"/>
      <stop offset="100%" stop-color="#1e4a9a"/>
    </radialGradient>
  </defs>
  <circle cx="32" cy="32" r="30" fill="url(#wash)"/>
  <!-- chest hint -->
  <ellipse cx="30" cy="44" rx="12" ry="10" fill="#e8732a"/>
  <ellipse cx="28" cy="42" rx="7" ry="6" fill="#f4c48a" opacity="0.85"/>
  <!-- head -->
  <circle cx="30" cy="30" r="16" fill="url(#head)"/>
  <!-- speckles -->
  <circle cx="22" cy="22" r="1.1" fill="#d4e8ef" opacity="0.9"/>
  <circle cx="28" cy="18" r="0.9" fill="#d4e8ef" opacity="0.75"/>
  <circle cx="34" cy="21" r="0.8" fill="#d4e8ef" opacity="0.7"/>
  <circle cx="24" cy="28" r="0.7" fill="#d4e8ef" opacity="0.55"/>
  <!-- cheek -->
  <ellipse cx="36" cy="34" rx="4.2" ry="3.4" fill="#f2c14e"/>
  <!-- white throat -->
  <ellipse cx="34" cy="40" rx="3.5" ry="2.4" fill="#faf3e3"/>
  <!-- beak -->
  <path d="M40 33 L58 30.5 L40 37 Z" fill="#e8732a"/>
  <path d="M40 33.4 L56.5 30.8 L40 35.2 Z" fill="#f09850" opacity="0.55"/>
  <!-- eye -->
  <circle cx="36.5" cy="28.5" r="4.2" fill="#2b2420"/>
  <circle cx="37.8" cy="27.2" r="1.35" fill="#faf3e3"/>
</svg>
